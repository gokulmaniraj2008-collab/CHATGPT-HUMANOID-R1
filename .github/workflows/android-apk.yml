name: Build HUMANOID R1 Android APK

on:
  pull_request:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
      - "docs/ANDROID_APP.md"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:mobile

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply app icon and Android media permissions
        run: node scripts/prepare-android.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-r1-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
